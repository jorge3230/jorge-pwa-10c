<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pedido Básico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
<div class="encabezado">
    <div class="logo">P</div>
    <div>
        <h1>Formulario de Pedido</h1>
        <p>Selecciona un producto, indica la cantidad y calcula el total.</p>
    </div>
</div>
<form id="formPedido">

    <label for="nombre">Nombre del cliente</label>
    <input
        type="text"
        id="nombre"
        placeholder="Escribe tu nombre"
        required>

    <label for="correo">Correo electrónico</label>
    <input
        type="email"
        id="correo"
        placeholder="ejemplo@correo.com"
        required>

    <label for="producto">Producto</label>
    <select id="producto" required>
       <option value="">Selecciona un producto</option>
    <option value="8500">Laptop - $8,500.00</option>
    <option value="3500">Monitor - $3,500.00</option>
    <option value="800">Teclado - $800.00</option>
    <option value="450">Mouse - $450.00</option>
    <option value="150">Memoria USB - $150.00</option>
    <option value="250">Cable HDMI - $250.00</option>
</select>

<label for="cantidad">Cantidad</label>
<input
    type="number"
    id="cantidad"
    min="1"
    value="1"
    required>

<label for="pago">Método de pago</label>
<select id="pago" required>
    <option value="">Selecciona una opción</option>
    <option value="Efectivo">Efectivo</option>
    <option value="Tarjeta">Tarjeta</option>
    <option value="Transferencia">Transferencia</option>
    <option value="Pago">Pago contra entrega</option> 
     <option value="Regalo">Regalo "Felicidades"</option>
</select>
<div class="botones">
    <button type="submit">Calcular pedido</button>
    <button type="reset" class="secundario">Limpiar</button>
</div>
</form>

<section id="resumen" class="resumen oculto">
    <h2>Resumen del pedido</h2>
<p>
    <strong>Cliente:</strong>
    <span id="rNombre"></span>
</p>
<p>
    <strong>Correo:</strong>
    <span id="rCorreo"></span>
</p>
<p>
    <strong>Producto:</strong>
    <span id="rProducto"></span>
</p>
<p>
    <strong>Precio unitario:</strong>
    <span id="rPrecio"></span>
</p>
    <strong>Cantidad:</strong>
    <span id="rCantidad"></span>
</p>
<p>
    <strong>Método de pago:</strong>
    <span id="rPago"></span>
</p>
<div class="total">
    Total:
    <span id="rTotal">$0.00</span>
</div>
</section>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
